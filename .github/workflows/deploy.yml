name: Deploy

on:
  push:
    branches: [main]
  # A deploy you can trigger by hand, for re-running one that failed on
  # something transient without having to push an empty commit.
  workflow_dispatch:

concurrency:
  # One deploy at a time, and never cancel one mid-flight: the server pulls,
  # migrates and rebuilds in place, so a half-finished run leaves the box in a
  # state nobody chose. A queued run simply waits.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy → Lightsail
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.PROD_SSH_KEY }}
          # The build is the slow part: ~6-11 minutes on a 512 MB box, most of
          # it npm ci and next build paging through swap. 20 minutes looked
          # like ample headroom until a mis-detected Turbopack workspace root
          # widened the tree the build walks and ran straight past it. That
          # cause is fixed in next.config.ts, but the margin was thinner than
          # it read, so 30 minutes - still short enough that a genuinely hung
          # deploy does not hold the runner all afternoon.
          command_timeout: 30m
          envs: DEPLOY_SHA
          script: |
            set -euo pipefail

            cd /app
            echo "→ Deploying $DEPLOY_SHA ..."

            # --force because a rewritten main should still deploy rather than
            # leave the box on a ref git quietly refused to move.
            git fetch --force origin main

            # Reset to the exact commit that triggered this run, not to
            # whatever origin/main points at by the time the SSH session gets
            # here. Those differ whenever a second merge lands mid-deploy, and
            # the run would then report one commit while building another.
            git reset --hard "$DEPLOY_SHA"

            # git reset is not required to fail loudly on every way it can miss,
            # so ask the tree directly rather than trusting the exit code.
            HEAD_SHA=$(git rev-parse HEAD)
            if [ "$HEAD_SHA" != "$DEPLOY_SHA" ]; then
              echo "::error::checkout is $HEAD_SHA, expected $DEPLOY_SHA"
              exit 1
            fi
            git log --oneline -1

            cd /app/akshayam-fpa

            echo "→ Installing dependencies ..."
            NODE_OPTIONS=--max-old-space-size=1024 npm ci

            echo "→ Applying migrations ..."
            npm run db:migrate

            echo "→ Seeding first admin (create-only) ..."
            npm run seed:admin

            echo "→ Building ..."
            NODE_OPTIONS=--max-old-space-size=1024 npm run build

            # Stamped *after* the build, not before.
            #
            # Writing it first was wrong: when the build failed - as it did on
            # 18 Sep, on the 20-minute timeout - the file was left claiming a
            # commit that had never finished building, while .next and the
            # running process were still the previous one. /api/version would
            # then report a commit that was not serving, which is precisely the
            # lie this endpoint exists to prevent. Written here it can only
            # describe a build that completed, and the restart immediately
            # below is what puts that build in front of traffic.
            echo "→ Stamping the build ..."
            printf '{"commit":"%s","builtAt":"%s"}\n' \
              "$DEPLOY_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .version.json

            echo "→ Restarting ..."
            pm2 restart akshayam --update-env
            pm2 save

            # pm2 restart returns 0 once it has handed the process off, not once
            # the process has survived starting. On a 512 MB box a build that
            # pushes the app over max_memory_restart shows up as a restart loop,
            # which is worth catching here rather than as a puzzling smoke test.
            sleep 10
            if ! pm2 describe akshayam | grep -qE "status.*online"; then
              pm2 describe akshayam || true
              pm2 logs akshayam --lines 50 --nostream || true
              echo "::error::akshayam is not online after the restart"
              exit 1
            fi

            echo "→ Deploy step finished for $DEPLOY_SHA at $(date -u)"

      - name: Smoke test
        env:
          DEPLOY_SHA: ${{ github.sha }}
        # A green deploy step only means the commands exited 0. This asks the
        # public URL whether the app is actually answering, whether it is still
        # refusing anonymous visitors - a deploy that accidentally removed the
        # auth gate would otherwise pass quietly - and, above all, which commit
        # it is serving. Without that last check a box running week-old code
        # passes this job exactly like a box that just rebuilt.
        run: |
          set -euo pipefail
          URL="https://akshayam.artham.app"

          echo "→ waiting for the app to come back ..."
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -m 10 -w "%{http_code}" "$URL/login" || echo 000)
            [ "$code" = "200" ] && break
            sleep 5
          done

          login=$(curl -s -o /dev/null -m 15 -w "%{http_code}" "$URL/login")
          root=$(curl -s -o /dev/null -m 15 -w "%{http_code}" "$URL/")
          api=$(curl -s -o /dev/null -m 15 -w "%{http_code}" -X POST "$URL/api/users")

          echo "/login            -> $login  (want 200)"
          echo "/ signed out      -> $root   (want 307)"
          echo "POST /api/users   -> $api    (want 401)"

          [ "$login" = "200" ] || { echo "::error::login page is not serving"; exit 1; }
          [ "$root" = "307" ]  || { echo "::error::signed-out visitors are not being redirected"; exit 1; }
          [ "$api" = "401" ]   || { echo "::error::the API is not refusing anonymous callers"; exit 1; }

          echo "→ checking which commit is actually serving ..."
          body=$(curl -s -m 15 "$URL/api/version" || echo '{}')
          echo "GET /api/version  -> $body"

          served=$(printf '%s' "$body" | python3 -c \
            'import json,sys;print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || echo "")

          if [ -z "$served" ]; then
            echo "::error::/api/version did not answer with a commit, so the running"
            echo "::error::process predates this endpoint - which means the build from"
            echo "::error::this run is not what is serving."
            exit 1
          fi

          if [ "$served" != "$DEPLOY_SHA" ]; then
            echo "::error::the app is serving $served but this run deployed $DEPLOY_SHA."
            echo "::error::The build did not reach the running process."
            exit 1
          fi

          echo "✅ smoke test passed - $URL is serving $served"
